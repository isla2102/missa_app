<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISSA · 태블릿 가로 글꼴 비교</title><style>
@layer tokens, base, layout, components, responsive, utilities;
@layer tokens { :root { --draft-bg: #EEE7DA; --draft-surface: #F7F1E7; --draft-ink: #352B29; --draft-accent: #70283F; --draft-white: #FFFFFF; --draft-line: #8D7871; --draft-gap: 1rem; --draft-pad: 1.25rem; --draft-width: 76rem; --draft-hit: 2.75rem; --draft-view-width: 64rem; --draft-view-height: 48rem; --focus-ring: 3px solid var(--draft-accent); } }
@layer base { * { box-sizing: border-box; } body { margin: 0; color: var(--draft-ink); background: var(--draft-bg); font-family: 'Malgun Gothic',system-ui,sans-serif; line-height: 1.6; } h1,p { margin: 0; } h1 { font-size: 1.5rem; } select,button { font: inherit; color: inherit; background: var(--draft-surface); min-block-size: var(--draft-hit); border: 1px solid var(--draft-line); padding: .5rem; border-radius: .5rem; } button { cursor: pointer; } a { color: var(--draft-accent); } :focus-visible { outline: var(--focus-ring); } }
@layer layout { .compare { max-inline-size: var(--draft-width); padding: var(--draft-pad); margin-inline: auto; display: grid; gap: var(--draft-gap); } .compare__header,.compare__controls,.compare__presets { display: flex; align-items: end; flex-wrap: wrap; gap: var(--draft-gap); } .compare__header { justify-content: space-between; } }
@layer components { .compare__field { display: grid; gap: .25rem; } .compare__viewport { overflow: auto; border: 1px solid var(--draft-line); background: var(--draft-surface); } .compare__viewport:fullscreen { inline-size: 100%; block-size: 100%; } .compare__frame { display: block; inline-size: var(--draft-view-width); block-size: var(--draft-view-height); border: 0; max-inline-size: none; } .compare__preset[aria-pressed="true"] { background: var(--draft-accent); color: var(--draft-white); border-color: var(--draft-accent); } .compare__note { padding: var(--draft-gap); border: 1px solid var(--draft-line); } }
</style></head><body><main class="compare"><header class="compare__header"><h1>태블릿 가로 · 실제 리더에서 비교</h1><a href="02-ia-current.html">현재 앱</a></header><p>실제 앱 v77의 두 페이지·목차·스크롤을 사용합니다. <strong>1024 × 768, 축소 없이 1:1 표시</strong>합니다.</p><div class="compare__presets" role="group" aria-label="빠른 글꼴 비교"><button type="button" class="compare__preset" data-preset="a" aria-pressed="false">A · 고딕 18</button><button type="button" class="compare__preset" data-preset="b" aria-pressed="true">B · 명조 20</button><button type="button" class="compare__preset" data-preset="c" aria-pressed="false">C · 명조 22</button><button type="button" data-fullscreen>가로 화면 전체 보기</button></div><div class="compare__controls"><label class="compare__field">글꼴<select data-control="font"><option value="sans">고딕</option><option value="serif" selected>제목·본문 명조</option></select></label><label class="compare__field">본문 크기<select data-control="size"><option value="18">18px</option><option value="20" selected>20px</option><option value="22">22px</option></select></label><label class="compare__field">줄 간격<select data-control="leading"><option value="16">1.6</option><option value="18" selected>1.8</option><option value="20">2.0</option></select></label><label class="compare__field">여백<select data-control="spacing"><option value="normal">기본</option><option value="roomy">여유 있게</option></select></label><label class="compare__field">배경<select data-control="theme"><option value="a">미색</option><option value="b">종이색</option><option value="c">와인 다크</option></select></label><label class="compare__field">비교할 화면<select data-view><option value="reading">제1·제2독서</option><option value="prayer">주님의 기도</option><option value="score">자비송 악보</option></select></label></div><p data-status role="status">가로 리더 준비 중</p><div class="compare__viewport" data-viewport><iframe class="compare__frame" src="04-foundations-reader-v2.html" title="1024×768 태블릿 가로 실제 리더 비교"></iframe></div><div class="compare__note"><p>창이 좁으면 가로로 스크롤하세요. 화면에 맞춰 축소하지 않으므로 글자 크기를 그대로 비교할 수 있습니다.</p><p>비교 중 읽기 위치와 앱 조작은 미리보기 안에서만 유지됩니다. 실제 앱의 저장된 편성·설정을 변경하지 않습니다. 악보 안의 글자 크기는 원본 조판을 유지합니다.</p></div></main><script>
const frame=document.querySelector('iframe'),controls=Array.from(document.querySelectorAll('[data-control]'));const send=view=>{const values={type:'missa-typography-preview'};controls.forEach(select=>values[select.dataset.control]=select.value);if(view)values.view=view;frame.contentWindow.postMessage(values,'*');};frame.onload=()=>send(document.querySelector('[data-view]').value);controls.forEach(select=>select.onchange=()=>{document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed','false'));send();});document.querySelector('[data-view]').onchange=event=>send(event.target.value);document.querySelectorAll('[data-preset]').forEach(button=>button.onclick=()=>{const preset={a:{font:'sans',size:'18'},b:{font:'serif',size:'20'},c:{font:'serif',size:'22'}}[button.dataset.preset];for(const [key,value] of Object.entries(preset))document.querySelector('[data-control="'+key+'"]').value=value;document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));send();});window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.type!=='missa-typography-ready')return;const font=document.querySelector('[data-control="font"]').selectedOptions[0].textContent,size=document.querySelector('[data-control="size"]').value;document.querySelector('[data-status]').textContent=event.data.width+' × '+event.data.height+' · '+font+' · '+size+'px · 축소 없음';});document.querySelector('[data-fullscreen]').onclick=async()=>{try{await document.querySelector('[data-viewport]').requestFullscreen();}catch{document.querySelector('[data-status]').textContent='전체 화면을 열 수 없습니다. 아래 가로 스크롤로 원래 크기를 확인해 주세요.';}};
</script></body></html>
