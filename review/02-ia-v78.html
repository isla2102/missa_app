ed", "text": "[안내] 선다. 인쇄본의 선택지를 병기하며 현재 시기·양식은 미확정.\n◎ 알렐루야\n[자료에 오늘 복음 환호송 본문 없음 · 해설자 또는 성가대]\n◎ 알렐루야\n[알렐루야를 하지 않는 시기의 선택지]\n◎ 그리스도님, 찬미와 영광 받으소서.\n또는 ◎ 말씀이신 그리스도님 찬미받으소서.\n또는 ◎ 길이요 진리요 생명이신 그리스도님, 찬미받으소서.", "selectionStatus": "unconfirmed-alternatives"}, {"id": "ordinary-12", "key": "복음", "sourcePages": [5], "status": "draft-unverified", "text": "+ 주님께서 여러분과 함께.\n◎ 또한 사제의 영과 함께.\n+ (          )가(이) 전한 거룩한 복음입니다.\n[안내] 이마와 입술과 가슴에 십자 표시를 한다.\n◎ 주님, 영광 받으소서.\n[자료에 오늘 복음 본문 없음]\n+ 주님의 말씀입니다.\n◎ 그리스도님 찬미합니다.", "contentType": "variable-placeholder"}, {"id": "ordinary-13", "key": "강론", "sourcePages": [5], "status": "draft-unverified", "text": "[안내] 앉는다.\n[강론 원문 없음]"}, {"id": "ordinary-14", "key": "신앙 고백", "sourcePages": [6, 7], "status": "draft-unverified", "text": "[안내] 선다. 아래 두 양식은 인쇄본에 수록된 대안이며 자동 선택하지 않는다.\n[니케아 콘스탄티노폴리스 신경 · 인쇄본 표기는 “니케아 콘스탄티노플 신경”]\n+ 한 분이신 하느님을\n◎ 저는 믿나이다.\n전능하신 아버지, 하늘과 땅과 유형무형한 만물의 창조주를 믿나이다.\n또한 한 분이신 주 예수 그리스도, 하느님의 외아들\n영원으로부터 성부에게서 나신 분을 믿나이다.\n하느님에게서 나신 하느님, 빛에서 나신 빛\n참 하느님에게서 나신 참 하느님으로서, 창조되지 않고 나시어\n성부와 한 본체로서 만물을 창조하셨음을 믿나이다.\n성자께서는 저희 인간을 위하여, 저희 구원을 위하여\n하늘에서 내려오셨음을 믿나이다.\n[안내] 밑줄 부분에서 모두 깊은 절을 한다.\n또한 성령으로 인하여 동정 마리아에게서 육신을 취하시어\n사람이 되셨음을 믿나이다.\n본시오 빌라도 통치 아래서 저희를 위하여\n십자가에 못 박혀 수난하고 묻히셨으며\n성서 말씀대로 사흗날에 부활하시어\n하늘에 올라 성부 오른편에 앉아 계심을 믿나이다.\n그분께서는 산 이와 죽은 이를 심판하러 영광 속에 다시 오시리니\n그분의 나라는 끝이 없으리이다.\n또한 주님이시며 생명을 주시는 성령을 믿나이다.\n성령께서는 성부와 성자에게서 발하시고\n성부와 성자와 더불어 영광과 흠숭을 받으시며\n예언자들을 통하여 말씀하셨나이다.\n하나이고 거룩하고 보편되며 사도로부터 이어오는 교회를 믿나이다.\n죄를 씻는 유일한 세례를 믿으며\n죽은 이들의 부활과 내세의 삶을 기다리나이다. 아멘.\n[또는 사도 신경]\n+ 전능하신 천주 성부\n◎ 천지의 창조주를 저는 믿나이다.\n그 외아들 우리 주 예수 그리스도님\n[안내] 밑줄 부분에서 모두 깊은 절을 한다.\n성령으로 인하여 동정 마리아께 잉태되어 나시고\n본시오 빌라도 통치 아래서 고난을 받으시고\n십자가에 못박혀 돌아가시고 묻히셨으며\n저승에 가시어 사흗날에 죽은 이들 가운데서 부활하시고\n하늘에 올라 전능하신 천주 성부 오른편에 앉으시며\n그리로부터 산 이와 죽은 이를 심판하러 오시리라 믿나이다.\n성령을 믿으며\n거룩하고 보편된 교회와 모든 성인의 통공을 믿으며\n죄의 용서와 육신의 부활을 믿으며\n영원한 삶을 믿나이다.\n아멘.", "selectionStatus": "unconfirmed-alternatives"}, {"id": "ordinary-15", "key": "보편 지향 기도", "sourcePages": [7], "status": "draft-unverified", "text": "[자료에 오늘 보편 지향 기도 본문 없음]\n◎ 주님, 저희의 기도를 들어주소서.", "contentType": "variable-placeholder"}, {"id": "ordinary-16", "key": "예물 준비 · 봉헌 성가", "sourcePages": [7, 8], "status": "draft-unverified", "text": "[자료 안내] 봉헌 성가.\n+ 형제 여러분, 우리가 바치는 이 제사를\n전능하신 하느님 아버지께서 기꺼이 받아 주시도록 기도합시다.\n[안내] 선다.\n◎ 사제의 손으로 바치는 이 제사가\n주님의 이름에는 찬미와 영광이 되고\n저희와 온 교회에는 도움이 되게 하소서."}, {"id": "ordinary-17", "key": "예물 기도", "sourcePages": [8], "status": "draft-unverified", "text": "[자료에 오늘 예물 기도 본문 없음]\n+ ……비나이다. 또는 ……다스리시나이다.\n◎ 아멘.", "contentType": "variable-placeholder"}, {"id": "ordinary-18", "key": "감사 기도", "sourcePages": [8, 9, 10, 11], "status": "draft-unverified", "text": "[자료 안내] 인쇄본에 감사기도 제2양식이 수록되어 있다. 실제 미사에서 선택된 감사 기도·감사송은 미확정이다.\n[감사송 대화]\n+ 주님께서 여러분과 함께.\n◎ 또한 사제의 영과 함께.\n+ 마음을 드높이.\n◎ 주님께 올립니다.\n+ 우리 주 하느님께 감사합시다.\n◎ 마땅하고 옳은 일입니다.\n[인쇄본 수록 감사송 · 선택 미확정]\n+ 거룩하신 아버지, 사랑하시는 성자 예수 그리스도를 통하여\n언제나 어디서나 아버지께 감사함이\n참으로 마땅하고 옳은 일이며 저희 도리요 구원의 길이옵니다.\n아버지께서는 말씀이신 그리스도를 통하여 모든 것을 창조하시고\n그분을 저희에게 구세주로 보내셨으니\n그분께서는 성령으로 인하여\n동정 마리아에게서 사람으로 태어나셨나이다.\n성자께서는 아버지의 뜻을 이루시고자\n십자가에서 팔을 벌려 백성을 아버지께 모아들이셨으며\n죽음을 이기고 부활하셨나이다.\n그러므로 저희는 모든 천사와 성인과 함께\n아버지의 영광을 찬양하나이다.\n[거룩하시도다 · 별도 카드 참조]\n+ 거룩하신 아버지, 아버지께서는 모든 거룩함의 샘이시옵니다.\n+ 간구하오니\n[안내] 종을 친다.\n성령의 힘으로 이 예물을 거룩하게 하시어\n우리 주 예수 그리스도의 몸과 + 피가 되게 하소서.\n스스로 원하신 수난이 다가오자 예수님께서는\n빵을 들고 감사를 드리신 다음\n쪼개어 제자들에게 주시며 말씀하셨나이다.\n너희는 모두 이것을 받아 먹어라.\n이는 너희를 위하여 내어줄 내 몸이다.\n[안내] 종을 치면 사제가 들어올린 축성된 빵을 바라본다. 사제가 성반에 내려놓은 다음 깊은 절을 할 때 함께 절을 한다.\n저녁을 잡수시고 같은 모양으로\n잔을 들어 다시 감사를 드리신 다음\n제자들에게 주시며 말씀하셨나이다.\n너희는 모두 이것을 받아 마셔라.\n이는 새롭고 영원한 계약을 맺는 내 피의 잔이니\n죄를 사하여 주려고\n너희와 많은 이를 위하여 흘릴 피다.\n너희는 나를 기억하여 이를 행하여라.\n[안내] 종을 치면 사제가 들어올린 성작을 바라본다. 사제가 성체포 위에 내려놓은 다음 깊은 절을 할 때 함께 절을 한다.\n[신앙의 신비여 · 별도 카드 참조]\n+ 아버지,\n저희는 그리스도의 죽음과 부활을 기념하며\n생명의 빵과 구원의 잔을 봉헌하나이다.\n또한 저희가 아버지 앞에 나아와 봉사하게 하시니 감사하나이다.\n간절히 청하오니\n저희가 그리스도의 몸과 피를 받아 모시어\n성령으로 모두 한 몸을 이루게 하소서.\n+ 주님, 온 세상에 널리 퍼져 있는 교회를 생각하시어\n교황 (레오14세)와\n저희 주교 (타대오와 요한보스코)와\n모든 성직자와 더불어 사랑의 교회를 이루게 하소서.\n+ 부활의 희망 속에 고이 잠든 교우들과\n세상을 떠난 다른 이들도 모두 생각하시어\n그들이 주님의 빛나는 얼굴을 뵈옵게 하소서.\n저희에게도 자비를 베푸시어\n영원으로부터 주님의 사랑을 받는\n하느님의 어머니 복되신 동정 마리아와\n그 배필이신 성 요셉과 복된 사도들과 모든 성인과 함께\n영원한 삶을 누리며\n성자 예수 그리스도를 통하여 아버지를 찬양하게 하소서.\n+ 그리스도를 통하여, 그리스도와 함께, 그리스도 안에서\n성령으로 하나 되어, 전능하신 천주 성부\n모든 영예와 영광을 영원히 받으소서.\n◎ 아멘.", "selectionStatus": "unconfirmed-printed-form", "editorialNotes": ["교황·주교 이름은 사진에 인쇄된 표기를 옮긴 것이며 현재 직책자 검증이나 실제 전례 설정이 아님.", "감사기도 제2양식을 자동 선택하지 않음.", "일부 줄바꿈과 문장부호를 읽기 좋게 정리함."]}, {"id": "ordinary-19", "key": "거룩하시도다", "sourcePages": [9], "status": "draft-unverified", "text": "◎ 거룩하시도다! 거룩하시도다! 거룩하시도다!\n온 누리의 주 하느님!\n하늘과 땅에 가득 찬 그 영광!\n높은 데서 호산나!\n주님의 이름으로 오시는 분, 찬미받으소서.\n높은 데서 호산나!"}, {"id": "ordinary-20", "key": "신앙의 신비여", "sourcePages": [10], "status": "draft-unverified", "text": "[인쇄본의 세 응답을 병기하며 현재 사용할 응답은 미확정]\n+ 신앙의 신비여!\n[연중시기 표기 응답]\n◎ 주님께서 오실 때까지 주님의 죽음을 전하며 부활을 선포하나이다.\n[또는 사순시기 표기 응답]\n◎ 주님께서 오실 때까지 이 빵을 먹고 이 잔을 마실 적마다 주님의 죽음을 전하나이다.\n[또는 부활시기 표기 응답]\n◎ 십자가와 부활로 저희를 구원하신 주님, 길이 영광 받으소서.", "selectionStatus": "unconfirmed-alternatives", "editorialNotes": ["시기 표시는 인쇄본 전사이며 앱 전례 규칙으로 채택하지 않음."]}, {"id": "ordinary-21", "key": "아멘", "sourcePages": [11], "status": "draft-unverified", "text": "◎ 아멘."}, {"id": "ordinary-22", "key": "주님의 기도", "sourcePages": [12], "status": "draft-unverified", "text": "+ 하느님의 자녀 되어, 구세주의 분부대로 삼가 아뢰오니\n◎ 하늘에 계신 우리 아버지\n아버지의 이름이 거룩히 빛나시며\n아버지의 나라가 오시며\n아버지의 뜻이 하늘에서와 같이\n땅에서도 이루어지소서.\n오늘 저희에게 일용할 양식을 주시고\n저희에게 잘못한 이를 저희가 용서하오니\n저희 죄를 용서하시고\n저희를 유혹에 빠지지 않게 하시고\n악에서 구하소서.\n+ 주님, 저희를 모든 악에서 구하시고\n한평생 평화롭게 하소서.\n주님의 자비로 저희를 언제나 죄에서 구원하시고\n모든 시련에서 보호하시어\n복된 희망을 품고\n구세주 예수 그리스도의 재림을 기다리게 하소서."}, {"id": "ordinary-23", "key": "주님의 기도 맺음 환호", "sourcePages": [12], "status": "draft-unverified", "text": "◎ 주님께 나라와 권능과 영광이 영원히 있나이다."}, {"id": "ordinary-24", "key": "평화 예식", "sourcePages": [13], "status": "draft-unverified", "text": "+ 주 예수 그리스도님, 일찍이 사도들에게 말씀하시기를\n“너희에게 평화를 두고 가며\n내 평화를 주노라.” 하셨으니\n저희 죄를 헤아리지 마시고 교회의 믿음을 보시어\n주님의 뜻대로 교회를 평화롭게 하시고 하나 되게 하소서.\n주님께서는 영원히 살아 계시며 다스리시나이다.\n◎ 아멘.\n+ 주님의 평화가 항상 여러분과 함께.\n◎ 또한 사제의 영과 함께.\n+ 평화의 인사를 나누십시오.\n[안내] 모든 이는 가벼운 절을 하며 서로 평화와 친교와 사랑의 인사를 나눈다.\n◎ 평화를 빕니다."}, {"id": "ordinary-25", "key": "하느님의 어린양", "sourcePages": [13], "status": "draft-unverified", "text": "◎ 하느님의 어린양, 세상의 죄를 없애시는 주님\n자비를 베푸소서.\n하느님의 어린양, 세상의 죄를 없애시는 주님\n자비를 베푸소서.\n하느님의 어린양, 세상의 죄를 없애시는 주님\n평화를 주소서."}, {"id": "ordinary-26", "key": "영성체 예식 · 영성체 성가", "sourcePages": [13], "status": "draft-unverified", "text": "+ 보라! 하느님의 어린양, 세상의 죄를 없애시는 분이시니\n이 성찬에 초대받은 이는 복되도다.\n◎ 주님, 제 안에 주님을 모시기에 합당치 않사오나\n한 말씀만 하소서, 제 영혼이 곧 나으리이다.\n[자료에 오늘 영성체송·성가 번호 없음]"}, {"id": "ordinary-27", "key": "영성체 후 기도", "sourcePages": [14], "status": "draft-unverified", "text": "+ 기도합시다.\n[안내] 선다.\n[자료에 오늘 영성체 후 기도 본문 없음]\n……비나이다. 또는 ……다스리시나이다.\n◎ 아멘.", "contentType": "variable-placeholder"}, {"id": "ordinary-28", "key": "강복", "sourcePages": [14], "status": "draft-unverified", "text": "+ 주님께서 여러분과 함께.\n◎ 또한 사제의 영과 함께.\n[안내] 모든 이는 머리를 숙이고 밑줄 부분에서 성호를 긋는다.\n+ 전능하신 천주 성부와 + 성자와 성령께서는\n여기 모인 모든 이에게 강복하소서.\n◎ 아멘", "selectionStatus": "unconfirmed-printed-form"}, {"id": "ordinary-29", "key": "파견", "sourcePages": [14], "status": "draft-unverified", "text": "[인쇄본에 수록된 네 선택지 · 실제 양식 미확정]\n+ 미사가 끝났으니 가서 복음을 전합시다.\n◎ 하느님 감사합니다.\n[또는]\n+ 주님과 함께 가서 복음을 전합시다.\n◎ 하느님 감사합니다.\n[또는]\n+ 평화로이 가서 주님을 찬양하며 삽시다.\n◎ 하느님 감사합니다.\n[또는]\n+ 미사가 끝났으니 평화로이 가십시오.\n◎ 하느님 감사합니다.", "selectionStatus": "unconfirmed-alternatives"}, {"id": "ordinary-30", "key": "파견 성가", "sourcePages": [14], "status": "draft-unverified", "text": "[자료 안내] 파견성가.\n[자료에 성가 번호·가사 없음]", "contentType": "variable-placeholder"}, {"id": "ordinary-31", "key": "공지 사항", "sourcePages": [], "status": "draft-unverified", "text": "[제공 자료에 공지 사항 본문 없음]", "contentType": "missing"}]};


// Printed ◎ starts the assembly response; guidance does not end that speech turn.
function spokenSegments(text, initial='text'){
 const segments=[];let role=initial,current=null;
 const add=(kind,value)=>{if(!current || current.kind!==kind){current={kind,parts:[]};segments.push(current);}current.parts.push(value);};
 for(const raw of text.split('\n')){
  const line=raw.trim();if(!line)continue;if(line==='[본문]'){role='text';current=null;continue;}
  if(/^\[(?:안내|프레임 안내|자료 안내)/.test(line) || line.startsWith('인쇄본 안내:')){
   const part={kind:'guide',text:line};if(current && current.kind==='assembly')current.parts.push(part);else{segments.push({kind:'guide',parts:[part]});current=null;}continue;
  }
  if(line.startsWith('◎'))role='assembly';
  else if(line.startsWith('+'))role='priest';
  else if(line.startsWith('◆'))role='lector';
  else if(line.startsWith('[')){segments.push({kind:'guide',parts:[{kind:'guide',text:line}]});current=null;continue;}
  add(role,{kind:'text',text:line});
 }
 return segments;
}
function spokenRoleAt(text,offset,initial='text'){
 let role=initial;for(const line of text.slice(0,offset).split('\n')){if(line.trim().startsWith('◎'))role='assembly';else if(line.trim().startsWith('+'))role='priest';else if(line.trim().startsWith('◆'))role='lector';}return role;
}
function liturgyNode(text,initial='text'){
 const stack=document.createElement('div');stack.className='reader__liturgy';stack.__sourceText=text;stack.__initialRole=initial;
 spokenSegments(text,initial).forEach(segment=>{
  const parts=find('mode').value==='regular'?segment.parts.filter(part=>part.kind!=='guide'):segment.parts;if(!parts.length)return;
  const card=document.createElement('div');card.className=segment.kind==='guide'?'reader__guidance':`reader__speech-card reader__speech-card--${segment.kind}`;
  card.setAttribute('data-speech-role',segment.kind);
  if(['assembly','priest','lector'].includes(segment.kind))card.setAttribute('aria-label',({assembly:'합송',priest:'사제의 부분',lector:'독서자의 부분'})[segment.kind]);

  let speechBody=null;
  const openRow=markerText=>{const row=document.createElement('div');row.className='reader__speech-row';const marker=document.createElement('span');marker.className='reader__speech-marker';marker.setAttribute('aria-hidden','true');marker.textContent=markerText;speechBody=document.createElement('div');speechBody.className='reader__speech-body';row.append(marker,speechBody);card.append(row);};
  parts.forEach(part=>{
   if(part.kind==='guide'){const p=document.createElement('p');p.className=segment.kind==='guide'?'reader__speech-text':'reader__speech-text reader__guidance';p.textContent='안내 · '+part.text.replace(/^\[(?:안내|프레임 안내|자료 안내)\]\s*|^인쇄본 안내:\s*/,'');if(segment.kind==='guide')card.append(p);else{if(!speechBody)openRow('');speechBody.append(p);}return;}
   const match=part.text.match(/^([+◎◆○●])\s*/);if(match||!speechBody)openRow(match?match[1]:'');
   const p=document.createElement('p');p.className='reader__speech-text';p.textContent=match?part.text.slice(match[0].length):part.text;if(/성령으로 인하여|동정 마리아에게서 육신|사람이 되셨/.test(p.textContent))p.className+=' reader__bow-phrase';const blessing=p.textContent.match(/성부와\s*\+\s*성자와\s*성령/);if(blessing){const full=p.textContent;const before=document.createElement('span');before.textContent=full.slice(0,blessing.index);const marked=document.createElement('span');marked.className='reader__bow-phrase';marked.textContent=blessing[0];const after=document.createElement('span');after.textContent=full.slice(blessing.index+blessing[0].length);p.textContent='';p.append(before,marked,after);}speechBody.append(p);
  });
  stack.append(card);
 });return stack;
}
function decorateLiturgy(root){
 Array.from(root.querySelectorAll('.reader__item-text')).forEach(p=>{
  const source=p.textContent;if(!source || p.parentElement?.getAttribute('data-content-source')==='cbck-daily-collect')return;
  const parent=p.parentElement;p.replaceWith(liturgyNode(source));
  if(parent?.classList.contains('reader__content-card') && !parent.classList.contains('reader__content-card--score'))parent.classList.add('reader__content-card--liturgy');
 });
}
function replaceLiturgyText(root,text,initial='text'){
 const target=root.querySelector('.reader__liturgy')||root.querySelector('.reader__item-text');
 if(target){const parent=target.parentElement;target.replaceWith(liturgyNode(text,initial));if(parent?.classList.contains('reader__content-card') && !parent.classList.contains('reader__content-card--score'))parent.classList.add('reader__content-card--liturgy');}

"text","text":"5 야곱 집안아, 자, 주님의 빛 속에 걸어가자!","sourceRef":"cbck-20261018"},{"id":"reading-1-p19","role":"text","text":"주님의 말씀입니다.","sourceRef":"cbck-20261018"},{"id":"reading-1-p20","role":"assembly","text":"◎ 하느님, 감사합니다.","sourceRef":"cbck-20261018"}]},{"id":"psalm","kind":"psalm","title":"화답송","status":"verified","paragraphs":[{"id":"psalm-p1","role":"assembly","text":"◎ 주님은 민족들의 눈앞에 당신 정의를 드러내셨네.","sourceRef":"cbck-20261018"},{"id":"psalm-p2","role":"text","text":"또는","sourceRef":"cbck-20261018"},{"id":"psalm-p3","role":"assembly","text":"◎ 우리 하느님의 구원을 온 세상 땅끝마다 모두 보았네.","sourceRef":"cbck-20261018"},{"id":"psalm-p4","role":"text","text":"○ 주님께 노래하여라, 새로운 노래. 그분이 기적들을 일으키셨네. 그분의 오른손이, 거룩한 그 팔이 승리를 가져오셨네. ◎","sourceRef":"cbck-20261018"},{"id":"psalm-p5","role":"text","text":"○ 주님은 당신 구원을 알리셨네. 민족들의 눈앞에, 당신 정의를 드러내셨네. 이스라엘 집안을 위하여, 당신 자애와 진실을 기억하셨네. ◎","sourceRef":"cbck-20261018"},{"id":"psalm-p6","role":"text","text":"○ 우리 하느님의 구원을, 온 세상 땅끝마다 모두 보았네. 주님께 환성 올려라, 온 세상아. 즐거워하며 환호하여라, 찬미 노래 불러라. ◎","sourceRef":"cbck-20261018"},{"id":"psalm-p7","role":"text","text":"○ 비파 타며 주님께 찬미 노래 불러라. 비파에 가락 맞춰 노래 불러라. 쇠 나팔 뿔 나팔 소리에 맞춰, 임금이신 주님 앞에서 환성 올려라. ◎","sourceRef":"cbck-20261018"}]},{"id":"reading-2","kind":"reading","title":"제2독서","status":"verified","paragraphs":[{"id":"reading-2-p1","role":"text","text":"\u003c선포하는 사람이 없으면 어떻게 들을 수 있겠습니까? 파견되지 않았으면 어떻게 선포할 수 있겠습니까?>","sourceRef":"cbck-20261018"},{"id":"reading-2-p2","role":"lector","text":"▥ 사도 바오로의 로마서 말씀입니다.10,9-18","sourceRef":"cbck-20261018"},{"id":"reading-2-p3","role":"text","text":"형제 여러분, 여러분이 9 예수님은 주님이시라고 입으로 고백하고","sourceRef":"cbck-20261018"},{"id":"reading-2-p4","role":"text","text":"하느님께서 예수님을 죽은 이들 가운데에서 일으키셨다고","sourceRef":"cbck-20261018"},{"id":"reading-2-p5","role":"text","text":"마음으로 믿으면 구원을 받을 것입니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p6","role":"text","text":"10 곧 마음으로 믿어 의로움을 얻고, 입으로 고백하여 구원을 얻습니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p7","role":"text","text":"11 성경도 “그를 믿는 이는 누구나 부끄러운 일을 당하지 않으리라.” 하고 말합니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p8","role":"text","text":"12 유다인과 그리스인 사이에 차별이 없습니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p9","role":"text","text":"같은 주님께서 모든 사람의 주님으로서,","sourceRef":"cbck-20261018"},{"id":"reading-2-p10","role":"text","text":"당신을 받들어 부르는 모든 이에게 풍성한 은혜를 베푸십니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p11","role":"text","text":"13 과연 “주님의 이름을 받들어 부르는 이는 모두 구원을 받을 것입니다.”","sourceRef":"cbck-20261018"},{"id":"reading-2-p12","role":"text","text":"14 그런데 자기가 믿지 않는 분을 어떻게 받들어 부를 수 있겠습니까?","sourceRef":"cbck-20261018"},{"id":"reading-2-p13","role":"text","text":"자기가 들은 적이 없는 분을 어떻게 믿을 수 있겠습니까?","sourceRef":"cbck-20261018"},{"id":"reading-2-p14","role":"text","text":"선포하는 사람이 없으면 어떻게 들을 수 있겠습니까?","sourceRef":"cbck-20261018"},{"id":"reading-2-p15","role":"text","text":"15 파견되지 않았으면 어떻게 선포할 수 있겠습니까?","sourceRef":"cbck-20261018"},{"id":"reading-2-p16","role":"text","text":"이는 성경에 기록된 그대로입니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p17","role":"text","text":"“기쁜 소식을 전하는 이들의 발이 얼마나 아름다운가!”","sourceRef":"cbck-20261018"},{"id":"reading-2-p18","role":"text","text":"16 그러나 모든 사람이 복음에 순종한 것은 아닙니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p19","role":"text","text":"사실 이사야도 “주님, 저희가 전한 말을 누가 믿었습니까?” 하고 말합니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p20","role":"text","text":"17 그러므로 믿음은 들음에서 오고 들음은 그리스도의 말씀으로 이루어집니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p21","role":"text","text":"18 그러나 나는 묻습니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p22","role":"text","text":"그들이 들은 적이 없다는 것입니까? 물론 들었습니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p23","role":"text","text":"“그들의 소리는 온 땅으로, 그들의 말은 누리 끝까지 퍼져 나갔다.”","sourceRef":"cbck-20261018"},{"id":"reading-2-p24","role":"text","text":"주님의 말씀입니다.","sourceRef":"cbck-20261018"},{"id":"reading-2-p25","role":"assembly","text":"◎ 하느님, 감사합니다.","sourceRef":"cbck-20261018"}]},{"id":"acclamation","kind":"acclamation","title":"복음 환호송","status":"verif  if(!Array.isArray(doc.sections)||!doc.sections.length)return [...errors,'sections'];

 }

}

const hymnRoles=['entrance','offertory','communion','recessional'];
function parseHymnNumbers(text){if(!String(text).trim())return [];const parts=String(text).trim().split(/[\s,·]+/);if(parts.some(x=>!/^\d+$/.test(x)||Number(x)<1||Number(x)>528))throw Error('1부터 528 사이의 번호를 쉼표로 구분해 주세요.');return [...new Set(parts.map(Number))];}
function hymnStorageKey(date,slot){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!['main','dawn','youth'].includes(slot))throw Error('Invalid hymn context');return 'missa.hymns.v1:'+date+':'+slot;}
function cleanHymnSet(value){const out={};for(const role of hymnRoles){const numbers=value?.[role]||[];if(!Array.isArray(numbers)||numbers.some(n=>!Number.isInteger(n)||n<1||n>528))throw Error('Invalid hymn numbers');out[role]=[...new Set(numbers)];}return out;}
function readHymnSet(storage,date,slot){try{return cleanHymnSet(JSON.parse(storage.getItem(hymnStorageKey(date,slot))));}catch{return cleanHymnSet(null);}}
function writeHymnSet(storage,date,slot,value){const key=hymnStorageKey(date,slot),set=cleanHymnSet(value);storage.setItem(key,JSON.stringify(set));return set;}
function readLegacyHymnNumbers(storage,date,slot){hymnStorageKey(date,slot);const result=cleanHymnSet(null);let found=false;for(const [role,label] of [['entrance','입당'],['offertory','봉헌'],['communion','영성체'],['recessional','파견']]){const raw=storage.getItem('missa-v02-hymn|'+date+'|home|'+slot+'|'+label);if(raw===null)continue;found=true;const value=JSON.parse(raw);if(typeof value?.number!=='string'&&typeof value?.number!=='number'&&value?.number!=null)throw Error('구버전 번호 형식이 올바르지 않습니다.');result[role]=parseHymnNumbers(value?.number??'');}return found?result:null;}
function validateHymnBackup(value){
 if(!value||value.format!=='missa-hymns'||value.version!==1||!Array.isArray(value.records)||value.records.length>5000)throw Error('지원하지 않는 백업 형식입니다.');
 const seen=new Set();const records=value.records.map(record=>{const {date,slot,hymns}=record||{};if(typeof date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date))||new Date(date).toISOString().slice(0,10)!==date)throw Error('백업 날짜가 올바르지 않습니다.');const key=hymnStorageKey(date,slot);if(seen.has(key))throw Error('중복 편성이 있습니다.');seen.add(key);if(!hymns||Object.keys(hymns).length!==4||hymnRoles.some(role=>!Object.hasOwn(hymns,role)||!Array.isArray(hymns[role])||hymns[role].length>528))throw Error('성가 편성 형식이 올바르지 않습니다.');return {date,slot,hymns:cleanHymnSet(hymns)};});return {format:'missa-hymns',version:1,records};
}
function parseHymnBackup(text){if(text.length>2000000)throw Error('백업 파일이 너무 큽니다.');return validateHymnBackup(JSON.parse(text));}
function exportHymnBackup(storage){const records=[];for(let i=0;i<storage.length;i++){const key=storage.key(i);if(!key?.startsWith('missa.hymns.v1:'))continue;const match=key.match(/^missa\.hymns\.v1:(\d{4}-\d{2}-\d{2}):(main|dawn|youth)$/);if(!match)throw Error('저장된 편성 키가 올바르지 않습니다.');records.push({date:match[1],slot:match[2],hymns:JSON.parse(storage.getItem(key))});}records.sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));return validateHymnBackup({format:'missa-hymns',version:1,records});}
function restoreHymnBackup(storage,value){const backup=validateHymnBackup(value),previous=backup.records.map(r=>{const key=hymnStorageKey(r.date,r.slot);return {key,raw:storage.getItem(key)};});let written=0;try{for(const r of backup.records){writeHymnSet(storage,r.date,r.slot,r.hymns);written++;}}catch(error){let rollbackFailed=false;for(let i=written-1;i>=0;i--){try{const p=previous[i];if(p.raw===null)storage.removeItem(p.key);else storage.setItem(p.key,p.raw);}catch{rollbackFailed=true;}}throw Error(rollbackFailed?'복원 중 저장소 오류가 발생했습니다. 일부 변경의 원상 복구에 실패했습니다. 백업을 보관해 주세요.':'복원하지 못했습니다. 기존 편성을 유지했습니다.');}return backup.records.length;}

const tutorialKey='missa.reader.symbol-tutorial.v1';
const tutorialSteps=[
 ['◎ 합송','동그라미 두 개(◎)는 신자가 함께 바치는 부분입니다. 굵은 글씨와 강조 테두리 카드의 본문을 함께 바칩니다.'],
 ['+ 사제의 부분','십자가 모양(+) 표시는 사제가 바치는 부분입니다. 신자는 듣고, 이어지는 ◎ 합송에 참여합니다.'],
 ['안내와 선택 양식','안내 색으로 구분된 문장은 자세나 행동에 대한 설명입니다. 〈또는〉은 사제가 선택할 수 있는 다른 양식이 이어진다는 뜻입니다.'],
 ['페이지와 악보','본문은 아래 페이지 버튼으로 넘깁니다. 긴 악보와 신앙 고백은 카드 안에서 스크롤합니다. 이 설명은 오른쪽 아래 안내에서 언제든 다시 볼 수 있습니다.']
];
let tutorialIndex=0,tutorialOpener=null,tutorialSeen=false;
function paintTutorial(){const step=tutorialSteps[tutorialIndex];find('tutorial-title').textContent=step[0];find('tutorial-step').textContent=`${tutorialIndex+1} / ${tutorialSteps.length}`;find('tutorial-copy').textContent=step[1];find('tutorial-prev').disabled=tutorialIndex===0;find('tutorial-next').textContent=tutorialIndex===tutorialSteps.length-1?'시작하기':'다음';}
function showTutorial(trigger=null){tutorialOpener=trigger;tutorialIndex=0;paintTutorial();find('tutorial').showModal();find('tutorial-next').focus();}
function hasSeenTutorial(){try{return localStorage.getItem(tutorialKey)==='done';}catch{return tutorialSeen;}}
function finishTutorial(){tutorialSeen=true;try{localStorage.setItem(tutorialKey,'done');}catch{}find('tutorial').close();}
function nextTutorial(){if(tutorialIndex===tutorialSteps.length-1)finishTutorial();else{tutorialIndex++;paintTutorial();}}

find('viewport-rotate').onclick=()=>setViewerOrientation(viewerOrientation==='portrait'?'landscape':'portrait');
find('viewport-reset').onclick=()=>{setViewerOrientation('auto');find('part-next').focus({preventScroll:true});};
bindPageSwipe(find('book'));
find('part-prev').onclick = () => go(Math.max(0,part-1));
find('part-next').onclick = () => go(Math.min(parts.length-1,part+1));
find('page-prev').onclick = () => turnSpread(-1);
find('page-next').onclick = () => turnSpread(1);
find('mode').onchange = render; find('slot').onchange = () => { setViewerOrientation(viewerOrientation);context(); render(); };
find('date').onchange = () => {captureReaderScroll();persistReader();collectView=0;loadReaderDate(find('date').value);readerDate=null;context();render();};
document.querySelectorAll('[data-panel]').forEach(button => button.onclick = () => showPanel(button.dataset.panel,button));
find('close').onclick = () => find('drawer').close();
find('drawer').addEventListener('close', () => { render(); const target = selectedItem && document.getElementById(selectedItem); if (target) target.focus({preventScroll:true}); else opener?.focus(); });
let observedBookSize='';
if(typeof ResizeObserver!=='undefined')new ResizeObserver(entries=>{
 const rect=entries[0].contentRect;const size=`${Math.round(rect.width)}|${Math.round(rect.height)}`;
 if(size!==observedBookSize){observedBookSize=size;scheduleReflow();}
}).observe(find('book'));

find('source-dialog-close').onclick=()=>find('source-dialog').close();

loadReaderDate(find('date').value,true);
find('book').addEventListener('scroll',readerScrolled,true);
window.addEventListener('pagehide',()=>{captureReaderScroll();persistReader();});
setViewerOrientation(viewerOrientation);context(); render();

function appendHymnBackupControls(body){
 const section=document.createElement('section'),heading=document.createElement('h3');heading.textContent='성가 편성 백업·복원';section.append(heading);
 const status=document.createElement('p');status.setAttribute('role','status');
 const out=document.createElement('button');out.type='button';out.textContent='전체 편성 백업';out.onclick=()=>{try{const backup=exportHymnBackup(localStorage);const url=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='missa-hymns-backup.json';section.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=backup.records.length+'개 날짜·회차 편성을 백업했습니다.';}catch(error){status.textContent='백업 실패 · '+error.message;}};
 const label=document.createElement('label');label.textContent='복원할 JSON 백업 파일';const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.setAttribute('aria-label','복원할 JSON 백업 파일');label.append(input);
 const preview=document.createElement('div');let selection=0;input.onchange=async()=>{const token=++selection;preview.replaceChildren();try{const file=input.files[0];if(!file)return;if(file.size>2000000)throw Error('백업 파일이 너무 큽니다.');const backup=parseHymnBackup(await file.text());if(token!==selection)return;const note=document.createElement('p');note.textContent=backup.records.length+'개 편성 · 같은 날짜·회차는 아래 내용으로 바꾸며, 파일에 없는 편성은 유지합니다.';preview.append(note);for(const record of backup.records){const p=document.createElement('p');p.textContent=record.date+' · '+record.slot;preview.append(p);const before=readHymnSet(localStorage,record.date,record.slot);for(const [title,role] of Object.entries(hymnTitles)){const line=document.createElement('p');line.textContent=title+' · '+(before[role].join(', ')||'미등록')+' → '+(record.hymns[role].join(', ')||'미등록');preview.append(line);}}
 const apply=document.createElement('button');apply.type='button';apply.textContent='확인한 편성 복원';apply.disabled=!backup.records.length;apply.onclick=()=>{try{const count=restoreHymnBackup(localStorage,backup);preview.replaceChildren();input.value='';showPanel('hymn',opener);const result=document.createElement('p');result.setAttribute('role','status');result.textContent=count+'개 편성을 복원했습니다.';find('drawer-body').append(result);scheduleReflow(currentAnchor);}catch(error){status.textContent=error.message;}};const cancel=document.createElement('button');cancel.type='button';cancel.textContent='복원 취소';cancel.onclick=()=>{selection++;preview.replaceChildren();input.value='';status.textContent='복원을 취소했습니다. 기존 편성을 유지합니다.';};preview.append(apply,cancel);status.textContent='변경 내용을 확인해 주세요.';}catch(error){if(token===selection)status.textContent='파일을 읽지 못했습니다 · '+error.message;}};
 section.append(out,label,status,preview);body.append(section);
}
