<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISSA · 태블릿 가로 간격·모서리 비교</title><style>
@layer tokens, base, layout, components, responsive, utilities;
@layer tokens { :root { --draft-bg: #EEE7DA; --draft-surface: #F7F1E7; --draft-ink: #352B29; --draft-accent: #70283F; --draft-white: #FFFFFF; --draft-line: #8D7871; --draft-gap: 1rem; --draft-pad: 1.25rem; --draft-width: 76rem; --draft-hit: 2.75rem; --draft-view-width: 64rem; --draft-view-height: 48rem; --focus-ring: 3px solid var(--draft-accent); } }
@layer base { * { box-sizing: border-box; } body { margin: 0; color: var(--draft-ink); background: var(--draft-bg); font-family: 'Malgun Gothic',system-ui,sans-serif; line-height: 1.6; } h1,p { margin: 0; } h1 { font-size: 1.5rem; } select,button { font: inherit; color: inherit; background: var(--draft-surface); min-block-size: var(--draft-hit); border: 1px solid var(--draft-line); padding: .5rem; border-radius: .5rem; } button { cursor: pointer; } a { color: var(--draft-accent); } :focus-visible { outline: var(--focus-ring); } }
@layer layout { .compare { max-inline-size: var(--draft-width); padding: var(--draft-pad); margin-inline: auto; display: grid; gap: var(--draft-gap); } .compare__header,.compare__controls,.compare__presets { display: flex; align-items: end; flex-wrap: wrap; gap: var(--draft-gap); } .compare__header { justify-content: space-between; } }
@layer components { .compare__field { display: grid; gap: .25rem; } .compare__viewport { overflow: auto; border: 1px solid var(--draft-line); background: var(--draft-surface); } .compare__viewport:fullscreen { inline-size: 100%; block-size: 100%; } .compare__frame { display: block; inline-size: var(--draft-view-width); block-size: var(--draft-view-height); border: 0; max-inline-size: none; } .compare__preset[aria-pressed="true"] { background: var(--draft-accent); color: var(--draft-white); border-color: var(--draft-accent); } .compare__note { padding: var(--draft-gap); border: 1px solid var(--draft-line); } }
</style></head><body><main class="compare"><header class="compare__header"><h1>간격·모서리만 · 실제 가로 화면 비교</h1><a href="02-ia-current.html">현재 앱</a></header><p><strong>고정:</strong> 와인색 · 본문 명조 18px · 줄 간격 1.6 · 제목 고딕. 글꼴과 색상은 A/B/C 모두 같습니다.</p><div class="compare__presets" role="group" aria-label="간격과 모서리 비교"><button type="button" class="compare__preset" data-preset="a" aria-pressed="false">A · 촘촘하고 각지게</button><button type="button" class="compare__preset" data-preset="b" aria-pressed="true">B · 기본 간격·살짝 둥글게</button><button type="button" class="compare__preset" data-preset="c" aria-pressed="false">C · 여유 간격·더 둥글게</button><button type="button" data-fullscreen>가로 화면 전체 보기</button></div><div class="compare__controls"><label class="compare__field">간격만 변경<select data-control="density"><option value="compact">촘촘히</option><option value="normal" selected>기본</option><option value="roomy">여유 있게</option></select></label><label class="compare__field">모서리만 변경<select data-control="radius"><option value="square">각지게 · 0</option><option value="soft" selected>살짝 둥글게 · 6px</option><option value="round">더 둥글게 · 12px</option></select></label><label class="compare__field">배경<select data-control="theme"><option value="a">미색</option><option value="b">종이색</option><option value="c">와인 다크</option></select></label><label class="compare__field">비교할 화면<select data-view><option value="reading">제1·제2독서</option><option value="prayer">주님의 기도</option><option value="score">자비송 악보</option></select></label></div><p data-status role="status">리더 준비 중</p><div class="compare__viewport" data-viewport><iframe class="compare__frame" src="04-spacing-reader-v1.html" title="1024×768 태블릿 가로 간격·모서리 비교"></iframe></div><div class="compare__note"><p>1024 × 768 · 축소 없음. 창이 좁으면 가로로 스크롤하세요.</p><p>간격과 모서리를 따로 조합할 수 있습니다. 예: “기본 간격 + 각진 모서리”. 실제 앱에는 아직 적용하지 않았습니다.</p><p>기본·촘촘한 안의 버튼 높이는 최소44px, 여유 안은48px입니다. 미리보기는 실제 저장소와 분리되어 있습니다.</p></div></main><script>
const frame=document.querySelector('iframe'),controls=Array.from(document.querySelectorAll('[data-control]'));const send=view=>{const values={type:'missa-spacing-preview'};controls.forEach(s=>values[s.dataset.control]=s.value);if(view)values.view=view;frame.contentWindow.postMessage(values,'*');};frame.onload=()=>send(document.querySelector('[data-view]').value);controls.forEach(s=>s.onchange=()=>{document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed','false'));send();});document.querySelector('[data-view]').onchange=e=>send(e.target.value);document.querySelectorAll('[data-preset]').forEach(button=>button.onclick=()=>{const values={a:{density:'compact',radius:'square'},b:{density:'normal',radius:'soft'},c:{density:'roomy',radius:'round'}}[button.dataset.preset];for(const [key,value] of Object.entries(values))document.querySelector('[data-control="'+key+'"]').value=value;document.querySelectorAll('[data-preset]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));send();});window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.type!=='missa-spacing-ready')return;const density=document.querySelector('[data-control="density"]').selectedOptions[0].textContent,radius=document.querySelector('[data-control="radius"]').selectedOptions[0].textContent;document.querySelector('[data-status]').textContent=event.data.width+' × '+event.data.height+' · '+density+' · '+radius+' · 본문18px';});document.querySelector('[data-fullscreen]').onclick=async()=>{try{await document.querySelector('[data-viewport]').requestFullscreen();}catch{document.querySelector('[data-status]').textContent='전체 화면을 열 수 없습니다. 아래 가로 스크롤로 확인해 주세요.';}};
</script></body></html>
