@layer base { * {box-sizing:border-box;} body {margin:0;background:var(--reader-theme-bg);color:var(--reader-theme-ink);font:1rem/1.6 var(--reader-ui-font);} h1,h2,p {margin:0;} a {color:var(--reader-theme-accent);} button,summary,label {cursor:pointer;} :focus-visible {outline:var(--focus-ring);} } @layer layout { .check {padding:var(--reader-padding);display:grid;gap:var(--reader-gap);} .check__row {display:flex;align-items:center;flex-wrap:wrap;gap:var(--reader-gap);} .check__guide {padding:var(--reader-padding);border:1px solid var(--reader-theme-line);border-radius:var(--reader-radius);background:var(--reader-theme-surface);} .check__list {display:grid;gap:var(--reader-gap);margin-block:var(--reader-gap);} .check__item {display:flex;align-items:center;gap:var(--reader-gap);min-block-size:var(--reader-control-hit);} .check__viewport {overflow:auto;} .check__frame {display:block;width:var(--reader-preview-landscape-width);height:var(--reader-preview-landscape-height);border:0;outline:1px solid var(--reader-theme-line);} .check__notes {display:grid;gap:var(--reader-gap);} .check__notes textarea {width:100%;min-height:var(--reader-scroll-min);} } @layer components { .check__title {color:var(--reader-theme-accent);} .check__item input {width:var(--reader-marker-width);height:var(--reader-marker-width);accent-color:var(--reader-theme-accent);} .check__status {font-weight:var(--reader-response-weight);} [hidden] {display:none;} }</style></head><body><main class="check"><h1>7단계 · 사용 흐름 검수</h1><p>아래 실제 화면을 조작하고, 확인한 항목만 체크해 주세요. 체크는 사용자 확인 기록이며 자동 검사 통과나 단계 승인으로 처리하지 않습니다.</p><div class="check__row" role="group" aria-label="검수 순서"><button class="missa-button" type="button" data-flow="0" aria-pressed="true" aria-label="선택·저장">1 · 선택·저장</button><button class="missa-button" type="button" data-flow="1" aria-pressed="false" aria-label="읽기·표시">2 · 읽기·표시</button><button class="missa-button" type="button" data-flow="2" aria-pressed="false" aria-label="보조 화면">3 · 보조 화면</button></div><section class="check__guide" data-panel="0"><h2 class="check__title">1. 선택·저장</h2><div class="check__list"><label class="check__item"><input type="checkbox" data-step="0-0"><span><strong>1. 날짜별 추천</strong> — 상단 날짜를 10월 18일 → 10월 21일로 변경하고, 성가 패널의 추천 목록이 날짜에 맞춰 달라지는지 확인합니다.</span></label><label class="check__item"><input type="checkbox" data-step="0-1"><span><strong>2. 회차별 저장</strong> — 교중미사에서 성가 패널을 열고 입당 성가에 48, 63을 입력한 뒤 ‘편성 저장’을 누릅니다.</span></label><label class="check__item"><input type="checkbox" data-step="0-2"><span><strong>3. 새로고침 유지</strong> — 위쪽 ‘프로토타입 새로고침’을 누르고 성가 패널을 다시 열어 48, 63이 유지되는지 확인합니다.</span></label><label class="check__item"><input type="checkbox" data-step="0-3"><span><strong>4. 날짜·회차 분리</strong> — 새벽미사 또는 다른 날짜로 바꿨다가 원래 날짜·교중미사로 돌아와 저장한 편성이 유지되는지 확인합니다.</span></label></div></section><section class="check__guide" data-panel="1" hidden><h2 class="check__title">2. 읽기·표시</h2><div class="check__list"><label class="check__item"><input type="checkbox" data-step="1-0"><span><strong>1. 낭송·성가</strong> — 자비송·대영광송 등에서 낭송/성가를 전환하고 제목·본문 중복이나 빈 페이지가 없는지 확인합니다.</span></label><label class="check__item"><input type="checkbox" data-step="1-1"><span><strong>2. 양식 선택</strong> — 참회 1·2·3양식과 신앙고백 양식을 전환하고 선택 표시와 안내가 맞는지 확인합니다. 미연결 본문은 미연결 안내가 정상입니다.</span></label><label class="check__item"><input type="checkbox" data-step="1-2"><span><strong>3. 목차·읽기 위치</strong> — 본문을 읽는 중 목차를 접었다 펴도 같은 순서에 머무는지 확인합니다.</span></label><label class="check__item"><input type="checkbox" data-step="1-3"><span><strong>4. 테마·글꼴</strong> — 보기 설정에서 배경·본문 글꼴을 바꾸고 현재 순서와 스크롤 위치가 유지되는지 확인합니다.</span></label></div></section><section class="check__guide" data-panel="2" hidden><h2 class="check__title">3. 보조 화면</h2><div class="check__list"><label class="check__item"><input type="checkbox" data-step="2-0"><span><strong>1. 메뉴·설정</strong> — 메뉴에서 성가·주요 기도문·보기 설정으로 접근하고 닫은 뒤 열었던 버튼으로 돌아오는지 확인합니다.</span></label><label class="check__item"><input type="checkbox" data-step="2-1"><span><strong>2. 중앙 안내</strong> — 긴 안내 버튼을 눌러 중앙 창이 열리고 닫기·Esc로 돌아오는지 확인합니다.</span></label><label class="check__item"><input type="checkbox" data-step="2-2"><span><strong>3. 악보 모달</strong> — ‘악보 크게 보기’를 눌러 종이색 바탕·폭 맞춤·세로 스크롤과 닫기만 있는지 확인합니다.</span></label><label class="check__item"><input type="checkbox" data-step="2-3"><span><strong>4. 키보드</strong> — Tab으로 버튼·입력칸을 이동하고, 모달에서 배경 조작으로 초점이 빠지지 않는지 확인합니다.</span></label></div></section><div class="check__row"><button class="missa-button" type="button" data-js="reload">프로토타입 새로고침</button><a href="../prototype/index.html" target="_blank" rel="noopener">프로토타입만 새 탭으로 열기</a><p class="check__status" role="status" data-js="progress">0 / 12개 확인</p></div><p>가로 1024 × 768 실크기 · 좁은 창은 프레임을 가로로 스크롤하세요. 편성·설정은 별도 테스트 공간에 저장됩니다.</p><div class="check__viewport"><iframe class="check__frame" title="검수할 실제 미사 프로토타입" src="../prototype/index.html"></iframe></div><div class="check__notes"><label for="notes">발견한 문제</label><textarea class="missa-input" id="notes" placeholder="예: 10월 21일 교중미사 / 편성 저장 후 새로고침 / 입당 번호가 달라짐"></textarea><div class="check__row"><button class="missa-button missa-button--primary" type="button" data-js="export">검수 기록 내려받기</button><span>체크와 메모는 이 탭에만 유지됩니다. 필요하면 JSON 기록을 내려받으세요.</span></div></div></main><script>
document.querySelectorAll('[data-flow]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-flow]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));document.querySelectorAll('[data-panel]').forEach(n=>n.hidden=n.dataset.panel!==b.dataset.flow);});document.querySelectorAll('[data-step]').forEach(n=>n.onchange=()=>{document.querySelector('[data-js="progress"]').textContent=document.querySelectorAll('[data-step]:checked').length+' / 12개 확인';});document.querySelector('[data-js="reload"]').onclick=()=>{const f=document.querySelector('iframe');f.src=f.getAttribute('src');};document.querySelector('[data-js="export"]').onclick=()=>{const report={stage:7,kind:'manual-review',checks:[...document.querySelectorAll('[data-step]')].map(n=>({id:n.dataset.step,checked:n.checked,text:n.parentElement.textContent})),notes:document.querySelector('#notes').value};const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='missa-manual-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
