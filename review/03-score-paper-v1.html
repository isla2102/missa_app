</style></head><body><main class="compare"><header class="compare__header"><h1>실제 악보 · 바탕색만 비교</h1><a href="02-ia-current.html">앱에서 테마 바꾸기 →</a></header><p>같은 자비송 SVG를 같은 크기로 표시했습니다. 음표·가사·선 굵기·원본 파일은 같습니다.</p><div class="compare__grid"><article class="compare__card"><header class="compare__caption"><h2>흰색 · 기존</h2></header><div class="compare__paper compare__paper--white" tabindex="0" role="region" aria-label="흰색 · 기존 자비송 스크롤"><img class="compare__image" src="../docs/교중미사악보/reengraved/semantic-a4/kyrie.svg" alt="자비송 재조판 악보 · 흰색 · 기존"></div></article><article class="compare__card"><header class="compare__caption"><h2>A · 부드러운 미색</h2></header><div class="compare__paper compare__paper--a" tabindex="0" role="region" aria-label="A · 부드러운 미색 자비송 스크롤"><img class="compare__image" src="../docs/교중미사악보/reengraved/semantic-a4/kyrie.svg" alt="자비송 재조판 악보 · A · 부드러운 미색"></div></article><article class="compare__card"><header class="compare__caption"><h2>B · 짙은 종이색</h2></header><div class="compare__paper compare__paper--b" tabindex="0" role="region" aria-label="B · 짙은 종이색 자비송 스크롤"><img class="compare__image" src="../docs/교중미사악보/reengraved/semantic-a4/kyrie.svg" alt="자비송 재조판 악보 · B · 짙은 종이색"></div></article></div><section class="compare__note"><h2>앱에도 미리 반영했습니다</h2><p>A/B에서는 투명 SVG의 바탕이 미색으로 보입니다. 원본에 흰 종이가 들어 있는 사진·스캔은 흰 부분이 그대로 남습니다.</p><p>다크 모드 악보는 밝은 바탕을 유지합니다. 여기서는 가사·오선·작은 음표가 또렷한지 비교해 주세요.</p></section></main></body></html>
