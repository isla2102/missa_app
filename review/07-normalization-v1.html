<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISSA · 디자인 정규화와 위계 비교</title><link rel="stylesheet" href="../styles/tokens.css"><link rel="stylesheet" href="../styles/components/button.css"><style>
@layer tokens { :root { --draft-preview-width:64rem; --draft-preview-height:48rem; --draft-shell-padding:1rem; --draft-shell-gap:1rem; } }
@layer base { * { box-sizing:border-box; } body { margin:0; background:var(--ui-theme-bg); color:var(--ui-theme-ink); font-family:var(--font-ui); line-height:var(--type-ui-leading); } h1 { margin:0; font-size:1.5rem; } a { color:var(--ui-theme-accent); } select { font:inherit; padding:.5rem; } :focus-visible { outline:var(--focus-ring); } }
@layer layout { .compare { display:grid; gap:var(--draft-shell-gap); padding:var(--draft-shell-padding); } .compare__controls { display:flex; flex-wrap:wrap; align-items:center; gap:var(--draft-shell-gap); } }
@layer components { .compare__viewport { overflow:auto; } .compare__frame { display:block; border:0; width:var(--draft-preview-width); height:var(--draft-preview-height); } .compare__summary { margin:0; } }
</style></head><body><main class="compare"><h1>디자인 정규화 · 시각적 위계 A/B/C</h1><p class="compare__summary">1024 × 768 실제 가로 크기. 색·글꼴·모서리는 유지합니다. 아래 위계안은 아직 미확정입니다.</p><div class="compare__controls" role="group" aria-label="위계 후보"><button class="missa-button" type="button" data-choice="a" aria-pressed="false">A · 본문 중심</button><button class="missa-button" type="button" data-choice="b" aria-pressed="true">B · 현재 구조 정돈</button><button class="missa-button" type="button" data-choice="c" aria-pressed="false">C · 조작 강조</button><a href="07-prototype-v2.html">정규화한 앱 열기</a></div><p class="compare__summary" data-description>B · 기존 카드 구분을 유지하고 버튼·입력·제목 간격을 공통 규칙으로 정돈했습니다.</p><div class="compare__controls"><label>검토 화면 <select data-view><option value="reading">독서·합송</option><option value="creed">신앙 고백·기도</option><option value="hymn">성가 편성</option></select></label><label>배경 <select data-theme><option value="cream">미색</option><option value="paper">종이색</option><option value="dark">와인 다크</option></select></label></div><div class="compare__viewport"><iframe class="compare__frame" title="가로보기 위계 비교" src="07-hierarchy-b-v1.html?theme=a"></iframe></div><p class="compare__summary">검수: 선택 B 체크·굵기 / 저장은 윤곽선 / 합송은 테두리 없음 / UI 고딕 16px / 본문 명조 18px·1.6. 다음: 후보 선택 후 시스템 반영과 재검수.</p></main><script>
const frame=document.querySelector('iframe');const descriptions={a:'A · 본문과 기도 발화 카드의 선을 덜어 책처럼 읽습니다. 합송 배경은 유지합니다.',b:'B · 기존 카드 구분을 유지하고 버튼·입력·제목 간격을 공통 규칙으로 정돈했습니다.',c:'C · 제목은 본문색으로, 선택·저장·합송은 와인색으로 강조합니다. 일반 내용 카드 경계도 덜었습니다.'};function send(){frame.contentWindow.postMessage({type:'missa-hierarchy',view:document.querySelector('[data-view]').value,theme:document.querySelector('[data-theme]').value},'*');}document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));document.querySelector('[data-description]').textContent=descriptions[b.dataset.choice];frame.src='07-hierarchy-'+b.dataset.choice+'-v1.html?theme='+({cream:'a',paper:'b',dark:'c'}[document.querySelector('[data-theme]').value]);});document.querySelectorAll('select').forEach(n=>n.onchange=send);window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='missa-hierarchy-ready')send();});
</script></body></html>
