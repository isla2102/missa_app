<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MISSA — 태블릿 미사 뷰어 프로토타입</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#28332e;background:#e9ece8}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #468d76;outline-offset:2px}.app{max-width:1500px;min-height:100vh;margin:auto;display:flex;flex-direction:column;background:#f6f7f3}.top,.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 24px;background:#fff;border-bottom:1px solid #e0e6df}.bottom{border-top:1px solid #e0e6df;border-bottom:0;position:sticky;bottom:0;z-index:4}.brand{font-family:Georgia,serif;font-size:23px;font-weight:700;letter-spacing:2px;color:#245c4c}.meta{font-size:13px;color:#69766f}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,select,input{border:1px solid #d3ded6;border-radius:9px;background:white;color:#31483d;padding:9px 12px;min-height:40px}.btn.active{background:#245c4c;color:white;border-color:#245c4c}.btn:hover{border-color:#609a84}.layout{flex:1;display:flex;min-height:0;position:relative}.reader{flex:1;min-width:0;padding:22px 28px 28px}.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:#657269}.tag{background:#e5eee7;border-radius:999px;padding:5px 10px;color:#245c4c}.warning{background:#fff5dc;color:#80621d;padding:6px 10px;border-radius:7px}.book{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:580px}.page{background:#fffdf8;box-shadow:0 4px 25px #283b3212;border:1px solid #e8e5da;padding:38px 44px;min-width:0;position:relative}.page:first-child{border-radius:4px 0 0 4px}.page:last-child{border-radius:0 4px 4px 0}.folio{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#929b94;font-size:12px}.eyebrow{font-size:12px;color:#8a6e45;letter-spacing:1px}.page h2{font-family:Georgia,'Noto Serif KR',serif;font-size:1.45em;font-weight:600;margin:12px 0 20px}.section{border-top:1px solid #e9e6de;padding:17px 0 6px}.section h3{font-size:1em;margin:0 0 10px;color:#245c4c}.section p{line-height:1.75;margin:7px 0;font-size:var(--reading-size,18px);word-break:keep-all}.speaker{font-size:12px;color:#777}.response{background:#eaf3eb;border-left:3px solid #45836a;padding:10px 12px;border-radius:4px}.hint{font-size:13px!important;color:#715e3e;background:#f8f1e5;padding:10px 12px;border-radius:7px}.muted{color:#7c857e;font-size:13px!important}.drawer{width:360px;flex-shrink:0;background:white;border-left:1px solid #dfe6df;padding:22px;box-shadow:-10px 0 30px #203a2a14;z-index:3;overflow:auto}.drawer.overlay{position:absolute;right:0;top:0;bottom:0;max-width:88vw}.drawer h2{font-size:20px;margin:0 0 18px}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer .item{display:block;width:100%;text-align:left;padding:13px;margin:7px 0;border:1px solid #e3e8e3;border-radius:9px;background:#fafbf9}.drawer .item:hover{background:#eaf3eb}.drawer textarea{width:100%;min-height:80px;border:1px solid #d3ded6;border-radius:8px;padding:9px;font:inherit}.drawer .mini{font-size:12px;color:#68796d}.hymn-link{border:0;background:none;color:#245c4c;text-decoration:underline;cursor:pointer;padding:0;font:inherit}body.dark .hymn-link{color:#b8e5ca}.help{font-size:13px;line-height:1.7;color:#69766f}.footer-note{font-size:12px;color:#7a817b}.count{min-width:68px;text-align:center;font-size:13px;color:#637167}.mobile-message{display:none}body.dark .app{background:#222a26;color:#e7ede7}body.dark .top,body.dark .bottom,body.dark .drawer{background:#2d3831;color:#e7ede7;border-color:#49574d}body.dark .page{background:#313b34;color:#f2f2e9;border-color:#485348}body.dark .section{border-color:#526055}body.dark .section h3{color:#a5d5bb}body.dark .response{background:#3c5849}body.dark .hint{background:#544b39;color:#f1dbad}body.dark .btn,body.dark select,body.dark input{background:#3a483f;color:#fff;border-color:#607265}body.dark .tag{background:#40594a;color:#d5f0db}body.dark .warning{background:#655735;color:#ffe2a0}body.dark .drawer .item{background:#354139;color:#f1f3ed;border-color:#536258}
@media(max-width:950px){.top{align-items:flex-start;flex-direction:column}.reader{padding:12px}.page{padding:24px}.book{min-height:520px}.drawer{width:300px}}@media(max-width:680px){.book{grid-template-columns:1fr}.page:nth-child(2){display:none}.page{min-height:560px}.reader{padding:8px}.top,.bottom{padding:10px}.meta{font-size:11px}.btn,select{padding:8px}.drawer{width:100%;max-width:100vw!important}.footer-note{display:none}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">MISSA <span class="meta">/ 오늘의 미사</span></div><div class="meta">한국어 예비신자 · 일반 신자용 통합 미사 뷰어 — UI 검증용</div></div><div class="controls"><label class="meta" for="date">날짜</label><input id="date" type="date" value="2026-10-18"><label class="meta" for="parish">본당</label><select id="parish" aria-label="본당"><option value="home">내 본당 (예시)</option><option value="visit">방문 본당 (예시)</option></select><label class="meta" for="massSlot">미사 회차</label><select id="massSlot" aria-label="미사 회차"></select><select id="scenario" aria-label="전례 예시"><option value="ordinary">연중 주일 · 예시</option><option value="lent">사순 주일 · 예시</option><option value="weekday">연중 평일 · 예시</option></select><select id="role" aria-label="사용자 모드"><option value="beginner">예비신자 모드</option><option value="regular">일반 신자 모드</option></select><button class="btn" id="smaller" aria-label="글자 작게">A−</button><button class="btn" id="larger" aria-label="글자 크게">A+</button><button class="btn" id="dark">다크</button></div></header><main class="layout"><div class="reader"><div class="status"><span id="season" class="tag">연중 시기</span><span id="dateLabel"></span><span id="massLabel" class="tag"></span><span class="warning">샘플 데이터 · 전례/성가 자동 수집 미연동</span></div><div class="book" id="book" aria-live="polite"></div></div><aside id="drawer" class="drawer overlay" hidden aria-label="보조 패널"><div class="drawer-head"><h2 id="drawerTitle">목차</h2><button class="btn" id="close" aria-label="보조 패널 닫기">✕</button></div><div id="drawerBody"></div></aside></main><footer class="bottom"><div class="controls"><button class="btn" data-panel="toc">☷ 목차</button><button class="btn" data-panel="hymn">♫ 성가</button><button class="btn" data-panel="prayer">✧ 기도</button><button class="btn" data-panel="info">ⓘ 안내</button></div><span class="footer-note">공식 전례문 아님 · 실제 미사에서 본당 안내 우선</span><div class="controls"><button class="btn" id="prev">← 이전</button><span class="count" id="counter"></span><button class="btn" id="next">다음 →</button></div></footer></div><script>
const samples=[{title:'시작 예식',items:[{title:'입당 성가',body:'본당에서 지정한 성가를 연결합니다.',kind:'hymn'},{title:'성호경과 인사',body:'미사의 시작을 알리는 예식문이 이곳에 표시됩니다.',response:'신자가 응답하는 문구를 강조하여 보여줍니다.',hint:'일반적으로 일어서서 시작 예식에 참여합니다.'},{title:'참회 예식',body:'사제가 선택한 예식 양식에 따라 본문이 달라집니다.',hint:'선택된 양식이 없으면 미확정 상태로 표시합니다.'},{title:'자비송',body:'해당 예식에 따라 자비송을 바칩니다.'},{title:'대영광송',body:'전례 규칙에 따라 포함 여부가 결정됩니다.',condition:'gloria'},{title:'본기도',body:'해당 전례일의 공식 본기도를 연결합니다.'}]},{title:'말씀 전례',items:[{title:'제1독서',body:'공식 매일미사에서 해당 독서 본문을 연결합니다.',hint:'앉아서 말씀을 듣습니다.'},{title:'화답송',body:'화답송의 시편과 응답이 표시됩니다.'},{title:'제2독서',body:'해당되는 전례일에만 표시됩니다.',condition:'second'},{title:'복음 환호송',body:'전례 시기에 맞는 복음 환호송이 표시됩니다.',hint:'복음 환호송 때 일어섭니다.'},{title:'복음',body:'해당 날짜의 공식 복음 본문이 표시됩니다.',response:'복음 전후 신자 응답이 강조됩니다.',hint:'복음 봉독 동안 일어서서 듣습니다.'},{title:'강론',body:'강론을 듣는 단계입니다.'},{title:'신앙 고백',body:'해당되는 전례일에 표시됩니다.',condition:'creed'},{title:'보편 지향 기도',body:'본당에서 준비한 기도 지향을 연결합니다.'}]},{title:'성찬 전례',items:[{title:'예물 준비',body:'봉헌 성가를 지정할 수 있습니다.',kind:'hymn'},{title:'예물 기도',body:'해당 전례일의 예물 기도를 연결합니다.'},{title:'감사 기도',body:'사제가 선택한 감사 기도 양식을 표시합니다.',hint:'기도 양식은 앱이 임의로 확정하지 않습니다.'},{title:'주님의 기도와 평화 예식',body:'해당 통상문과 신자 응답을 연결합니다.'},{title:'영성체',body:'영성체송 및 지정된 성가를 연결합니다.',hint:'아직 세례받지 않은 예비신자는 성체를 모시지 않습니다. 본당의 참여 안내를 따르세요.'},{title:'영성체 후 기도',body:'해당 전례일의 공식 기도를 연결합니다.'}]},{title:'마침 예식',items:[{title:'공지 사항',body:'본당의 공지가 있을 경우 표시합니다.'},{title:'강복과 파견',body:'통상문과 신자 응답을 연결합니다.',hint:'본당의 안내에 따라 함께 응답합니다.'},{title:'파견 성가',body:'본당에서 지정한 성가를 연결합니다.',kind:'hymn'}]}];
const scenarios={ordinary:{name:'연중 시기 주일',season:'연중 시기',gloria:true,second:true,creed:true,acclamation:'알렐루야'},lent:{name:'사순 시기 주일',season:'사순 시기',gloria:false,second:true,creed:true,acclamation:'사순 시기 복음 환호'},weekday:{name:'연중 시기 평일',season:'연중 시기',gloria:false,second:false,creed:false,acclamation:'알렐루야'}};
const parishSlots={home:[{id:'dawn',name:'새벽미사',time:'06:00'},{id:'main',name:'교중미사',time:'11:00'},{id:'youth',name:'저녁 청년미사',time:'19:00'}],visit:[{id:'morning',name:'오전미사',time:'09:00'},{id:'evening',name:'저녁미사',time:'18:00'}]};
const hymnParts=['입당','봉헌','영성체','파견'];
const readStore=(key,def='')=>{try{return localStorage.getItem(key)??def}catch{return def}};
const writeStore=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};
function slotKey(){return [$('date').value,$('parish').value,$('massSlot').value].join('|')}
function hymnKey(part){return 'missa-v02-hymn|'+slotKey()+'|'+part}
function hymnData(part){try{return JSON.parse(readStore(hymnKey(part),'{}'))}catch{return {}}}
function slotName(){const s=parishSlots[$('parish').value].find(x=>x.id===$('massSlot').value);return s?s.name+' · '+s.time:'미사 미선택'}
function populateSlots(){const old=$('massSlot').value,slots=parishSlots[$('parish').value];$('massSlot').innerHTML=slots.map(s=>`<option value="${s.id}">${s.time} · ${s.name}</option>`).join('');$('massSlot').value=slots.some(s=>s.id===old)?old:slots[0].id}
let spread=0,size=18,panel=null;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function pageData(){const sc=scenarios[$('scenario').value];let sections=samples.map(s=>({...s,items:s.items.filter(x=>!x.condition||sc[x.condition]).map(x=>({...x,body:x.title==='복음 환호송'?sc.acclamation+' — 실제 본문은 공식 자료 연결 후 표시':x.body}))}));return sections}
function render(){const sections=pageData(),beginner=$('role').value==='beginner';$('season').textContent=scenarios[$('scenario').value].season;$('dateLabel').textContent=$('date').value+' · '+scenarios[$('scenario').value].name;$('massLabel').textContent=slotName();const pages=sections.map((s,i)=>`<article class="page" style="--reading-size:${size}px"><div class="eyebrow">MISSA / ${esc(s.title)}</div><h2>${esc(s.title)}</h2>${s.items.map(x=>`<section class="section"><h3>${esc(x.title)}</h3>${x.kind==='hymn'?`<p class="muted">♪ <button class="hymn-link" data-open-hymn="${x.title==='입당 성가'?'입당':x.title==='예물 준비'?'봉헌':x.title==='파견 성가'?'파견':'영성체'}">${esc((hymnData(x.title==='입당 성가'?'입당':x.title==='예물 준비'?'봉헌':x.title==='파견 성가'?'파견':'영성체').number||'미등록')+' · '+(hymnData(x.title==='입당 성가'?'입당':x.title==='예물 준비'?'봉헌':x.title==='파견 성가'?'파견':'영성체').title||'성가 설정'))}</button></p>`:''}<p>${esc(x.body)}</p>${beginner&&x.response?`<p class="response"><span class="speaker">신자 응답 · 안내 예시</span><br>${esc(x.response)}</p>`:''}${beginner&&x.hint?`<p class="hint">ⓘ ${esc(x.hint)}</p>`:''}</section>`).join('')}<div class="folio">${i+1}</div></article>`);const left=spread*2;$('book').innerHTML=pages[left]+(pages[left+1]||'<article class="page"><h2>다음 페이지</h2></article>');$('counter').textContent=`${spread+1} / ${Math.ceil(pages.length/2)}`;$('prev').disabled=spread===0;$('next').disabled=spread>=Math.ceil(pages.length/2)-1;document.querySelectorAll('[data-open-hymn]').forEach(b=>b.onclick=()=>setPanel('hymn',b.dataset.openHymn));}
function setPanel(which,focusPart=''){if(panel===which&&!focusPart){panel=null;$('drawer').hidden=true;return}panel=which;$('drawer').hidden=false;const titles={toc:'미사 목차',hymn:'미사별 성가',prayer:'주요 기도문',info:'사용 안내'};$('drawerTitle').textContent=titles[which];const body=$('drawerBody');if(which==='toc'){body.innerHTML=pageData().map((s,i)=>`<button class="item" data-go="${Math.floor(i/2)}">${i+1}. ${esc(s.title)}</button>`).join('');body.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{spread=Number(b.dataset.go);render();setPanel('toc')})}
else if(which==='hymn'){body.innerHTML=`<p class="help"><strong>${esc(slotName())}</strong><br>${esc($('date').value)} · ${$('parish').selectedOptions[0].textContent}<br>입력한 성가는 이 날짜·본당·회차에만 저장됩니다. 아래 가사 칸은 직접 입력한 개인 메모이며 자동 수집하지 않습니다.</p>`+hymnParts.map(k=>{const d=hymnData(k);return `<div class="item" id="hymn-${k}"><strong>${k} 성가</strong><label class="mini">번호<input data-part="${k}" data-field="number" placeholder="번호 또는 코드" value="${esc(d.number||'')}" style="width:100%;margin:5px 0"></label><label class="mini">제목<input data-part="${k}" data-field="title" placeholder="성가 제목" value="${esc(d.title||'')}" style="width:100%;margin:5px 0"></label><label class="mini">개인용 가사/메모<textarea data-part="${k}" data-field="lyrics" placeholder="직접 입력한 가사 또는 메모">${esc(d.lyrics||'')}</textarea></label><label class="mini">공식 페이지 URL<input data-part="${k}" data-field="url" placeholder="https://..." value="${esc(d.url||'')}" style="width:100%;margin:5px 0"></label><button class="btn" data-link="${k}">외부 자료 열기 ↗</button></div>`}).join('');body.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('input',()=>{const part=el.dataset.part,d=hymnData(part);d[el.dataset.field]=el.value;writeStore(hymnKey(part),JSON.stringify(d));render()}));body.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>{const url=hymnData(b.dataset.link).url;if(/^https:\/\//i.test(url||''))window.open(url,'_blank','noopener,noreferrer');else alert('https://로 시작하는 자료 주소를 입력하세요.')});if(focusPart)body.querySelector('#hymn-'+focusPart)?.scrollIntoView({block:'nearest'});}
else if(which==='prayer'){body.innerHTML='<p class="help">성호경 · 주님의 기도 · 성모송 · 영광송</p><p class="help">기도문 원문 연결 전의 UI 자리표시자입니다.</p>'}
else{body.innerHTML='<p class="help">날짜·본당·미사 회차에 따라 성가 입력값이 분리됩니다. 전례 시기 선택은 여전히 수동 시뮬레이션이며, 실제 날짜 자동 판별은 구현되지 않았습니다.</p><p class="help">본당명·시간표는 임의의 테스트 데이터입니다. 데이터 수집/외부 API 호출은 하지 않습니다.</p><p class="help">개인 가사 메모는 현재 브라우저의 로컬 저장소에만 저장됩니다. 기기 간 동기화는 제공하지 않습니다.</p>'}}
$('prev').onclick=()=>{spread=Math.max(0,spread-1);render()};$('next').onclick=()=>{spread=Math.min(1,spread+1);render()};$('role').onchange=render;$('parish').onchange=()=>{populateSlots();render();if(panel==='hymn')setPanel('hymn')};$('massSlot').onchange=()=>{render();if(panel==='hymn')setPanel('hymn')};$('scenario').onchange=()=>{spread=0;render()};$('date').onchange=render;$('smaller').onclick=()=>{size=Math.max(14,size-2);render()};$('larger').onclick=()=>{size=Math.min(28,size+2);render()};$('dark').onclick=()=>document.body.classList.toggle('dark');document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>setPanel(b.dataset.panel));$('close').onclick=()=>{panel=null;$('drawer').hidden=true};document.addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();if(e.key==='Escape'&&panel)setPanel(panel)});let touchX=null;$('book').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});$('book').addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>80)(dx<0?$('next'):$('prev')).click();touchX=null},{passive:true});populateSlots();render();
</script></body></html>
